version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: roommate-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: roommate
      POSTGRES_PASSWORD: roommate_password
      POSTGRES_DB: roommate_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
