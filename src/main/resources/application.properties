spring.application.name=roommateApi
# =========================================
# Spring Boot Dev Profile
# =========================================

# Active profile
spring.profiles.active=dev

# -------------------------------
# Server
# -------------------------------
server.port=8080

# -------------------------------
# Database (PostgreSQL)
# -------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/roommate_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=roommate
spring.datasource.password=roommate_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=false

# -------------------------------
# JWT Configuration
# -------------------------------
jwt.secret=devSuperSecretKeyForJWT
jwt.expiration-ms=3600000

# -------------------------------
# Swagger / OpenAPI
# -------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# -------------------------------
# Logging
# -------------------------------
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG

# -------------------------------
# Misc
# -------------------------------
spring.main.banner-mode=console
spring.jackson.serialization.indent_output=true
